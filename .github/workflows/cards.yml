name: Atualizar cards do README

# Mesma espinha do repo kaminagakur4/kaminagakur4: todo card é ARQUIVO em
# profile/, servido pelo jsdelivr com pino no commit. Nenhum serviço desenha
# imagem na hora da visita. Os cards saem em inglês, como o README.
#
# Nada aqui tem nome de usuário escrito à mão: conta, repositório e e-mail dos
# commits vêm do contexto da Action. Subiu o repo, os cards saem com os dados
# da conta dona dele.

on:
  # Roda já no primeiro push: subiu o repo, a Action gera os cards e fixa o
  # README sozinha, sem ninguém clicar em nada. Push feito pela própria Action
  # (com GITHUB_TOKEN) não dispara outra rodada, então não há laço.
  push:
    branches: ["**"]
  schedule:
    # A cada 6h: um card de SEQUÊNCIA precisa dizer HOJE.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Dois pushes seguidos viram duas rodadas em fila, nunca ao mesmo tempo
# empurrando commit uma por cima da outra.
concurrency:
  group: cards
  cancel-in-progress: false

# Um arquivo por card, com cor única que funciona nos dois temas do GitHub.
env:
  COR: title_color=7A7A85&text_color=7A7A85&bg_color=00000000&hide_border=true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      # Histórico inteiro: o pino é "o último commit que tocou profile/", e num
      # clone raso o git não sabe responder isso.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guarda das imagens
        run: python3 scripts/pin-cards.py --verificar

      # Todos os geradores com continue-on-error de propósito: se um cair, o
      # arquivo anterior fica no repo e na tela, e os outros seguem. Dado velho
      # é aceitável, buraco na página não é.

      # GRS_TOKEN (PAT) conta repositórios privados; sem ele o card só vê os públicos.
      - name: Linguagens
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          path: profile/langs.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
          options: layout=compact&langs_count=8&card_width=340&${{ env.COR }}

      - name: Sequência
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/gerar-sequencia.py

      # A cobra comendo a grade de contribuições, no azul dos outros cards. O
      # primeiro tom de color_dots é a casa vazia: cinza com alfa, para a grade
      # aparecer no tema claro e no escuro com um arquivo só.
      - name: Cobra
        continue-on-error: true
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/cobra.svg?color_snake=#557ee5&color_dots=#7a7a8522,#557ee555,#557ee588,#557ee5bb,#557ee5

      - name: Comitar os cards
        id: cards
        run: |
          # Noreply da conta dona do repo, montado pela própria Action: o commit
          # conta como contribuição dela, e nenhum e-mail pessoal fica exposto.
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"

          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Nada mudou em nenhum card."
          else
            git commit -m "chore: atualiza cards do README"
            git pull --rebase --quiet
            git push
          fi
          # O pino é SEMPRE o último commit que tocou profile/. Com card novo é o
          # de agora; sem card novo é o anterior. Assim um README editado que
          # chegue com o pino zerado se conserta na próxima rodada, mesmo quando
          # nenhum card mudou.
          echo "sha=$(git log -1 --format=%H -- profile/)" >> "$GITHUB_OUTPUT"

      # NUNCA fixar o README numa URL que o jsdelivr ainda não serve: se o camo
      # buscar nessa janela, ele guarda a falha e o card some da página.
      - name: Aquecer o jsdelivr
        run: |
          falhou=0
          for f in profile/*.svg; do
            url="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.cards.outputs.sha }}/$f"
            quente=0
            for t in 1 2 3 4 5 6 7 8; do
              c=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              if [ "$c" = 200 ]; then
                echo "$f: quente na tentativa $t"
                quente=1
                break
              fi
              echo "$f: tentativa $t devolveu $c"
              sleep 10
            done
            if [ "$quente" = 0 ]; then
              falhou=1
            fi
          done
          if [ "$falhou" = 1 ]; then
            echo "::error::jsdelivr não aqueceu; o README fica no pino anterior, que funciona"
            exit 1
          fi

      - name: Fixar o README no commit dos cards
        run: |
          python3 scripts/pin-cards.py --fixar "${{ steps.cards.outputs.sha }}"
          git add README.md
          if git diff --cached --quiet; then
            echo "README já estava no pino certo."
          else
            curto=$(echo "${{ steps.cards.outputs.sha }}" | cut -c1-7)
            git commit -m "chore: fixa os cards no commit $curto"
            git pull --rebase --quiet
            git push
          fi
